backend:
  name: git-gateway
  branch: main

media_folder: static/images
public_folder: /images

collections:

  - name: "pages"
    label: "Pages"
    files:

      - name: "a-propos"
        label: "À propos"
        file: "content/a-propos.md"
        fields:
          - { label: "Titre", name: "title", widget: "string" }
          - { label: "Contenu", name: "body", widget: "markdown" }

      - name: "application"
        label: "L'application"
        file: "content/application.md"
        fields:
          - { label: "Titre", name: "title", widget: "string" }
          - { label: "Contenu", name: "body", widget: "markdown" }

      - name: "contact"
        label: "Contact"
        file: "content/contact.md"
        fields:
          - { label: "Titre", name: "title", widget: "string" }
          - { label: "Contenu", name: "body", widget: "markdown" }

  - name: "classroom"
    label: "Classroom"
    folder: "content/classroom"
    create: false
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Sous-titre", name: "subtitle", widget: "string", required: false }
      - { label: "Contenu", name: "body", widget: "markdown" }

  - name: "mosaic"
    label: "Mosaic"
    folder: "content/mosaic"
    create: false
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Sous-titre", name: "subtitle", widget: "string", required: false }
      - { label: "Contenu", name: "body", widget: "markdown" }

  - name: "ressources"
    label: "Blog / Ressources"
    folder: "content/ressources/posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Description", name: "description", widget: "string" }
      - { label: "Contenu", name: "body", widget: "markdown" }