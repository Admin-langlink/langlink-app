# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: Admin-langlink/langlink-app
  branch: main
  auth_methods: [token]

publish_mode: editorial_workflow
site_url: https://langlink.app

media_folder: /static/images
public_folder: /images

collections:
  - name: pages
    label: Pages du site
    files:
      - name: contact
        label: Contact
        file: content/contact.md
        preview_path: /contact/
        fields:
          - { name: title, label: Titre }
          - { name: subtitle, label: Sous-titre, required: false }
          - { name: description, label: Description pour Google, required: false }
          - { name: body, label: Texte de la page, widget: richtext }
      - name: accueil
        label: Accueil
        file: content/_index.md
        preview_path: /
        fields:
          - { name: title, label: Titre }
          - { name: description, label: Description pour Google, required: false }
      - name: a-propos
        label: À propos
        file: content/a-propos.md
        preview_path: /a-propos/
        fields:
          - { name: title, label: Titre }
          - { name: description, label: Description pour Google, required: false }
          - { name: body, label: Texte de la page, widget: richtext, required: false }
      - name: application
        label: Application
        file: content/application/index.md
        preview_path: /application/
        fields:
          - { name: title, label: Titre }
          - { name: description, label: Description pour Google, required: false }
      - name: mentions-legales
        label: Mentions légales
        file: content/mentions-legales.md
        preview_path: /mentions-legales/
        fields:
          - { name: title, label: Titre }
          - { name: subtitle, label: Sous-titre, required: false }
          - { name: description, label: Description pour Google, required: false }
          - { name: body, label: Texte de la page, widget: richtext, required: false }
      - name: ressources
        label: Ressources
        file: content/ressources/_index.md
        preview_path: /ressources/
        fields:
          - { name: title, label: Titre }
          - { name: subtitle, label: Sous-titre, required: false }
          - { name: description, label: Description pour Google, required: false }
          - { name: body, label: Texte de la page, widget: richtext, required: false }

  - name: classroom
    label: Classroom
