baseURL = "https://langlink.app/"
languageCode = "fr-FR"
defaultContentLanguage = "fr"
title = "Langlink"

enableRobotsTXT = true
# enableGitInfo requires a full Git history at build time; the Netlify deploy
# environment builds from a source archive, so reading the Git log fails and
# aborts the build. No template uses .GitInfo / .Lastmod, so it stays off.
enableGitInfo    = false

[params]
  description    = "Langlink connecte des classes du monde entier autour de projets culturels communs."
  author         = "Langlink"
  classroom_cta  = "Demander un pilote"
  mosaic_cta     = "Rejoindre maintenant"

[menu]

  [[menu.classroom]]
    name       = "Lancer un projet"
    url        = "/classroom/lancer-un-projet/"
    weight     = 10

  [[menu.classroom]]
    name       = "Sécurité & Pédagogie"
    url        = "/classroom/securite-pedagogie/"
    weight     = 20

  [[menu.classroom]]
    name       = "Ressources"
    url        = "/ressources/"
    weight     = 30

  [[menu.mosaic]]
    name       = "Welcome"
    url        = "/mosaic/welcome/"
    weight     = 10

  [[menu.mosaic]]
    name       = "Communauté"
    url        = "/mosaic/communaute/"
    weight     = 20

  [[menu.mosaic]]
    name       = "Galerie"
    url        = "/mosaic/galerie/"
    weight     = 30

  [[menu.footer]]
    name       = "À propos"
    url        = "/a-propos/"
    weight     = 10

  [[menu.footer]]
    name       = "Contact"
    url        = "/contact/"
    weight     = 20

  [[menu.footer]]
    name       = "Mentions légales"
    url        = "/mentions-legales/"
    weight     = 30

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[build]
  writeStats = true

[outputs]
  home    = ["HTML", "RSS"]
  section = ["HTML"]
  page    = ["HTML"]

[services]
  [services.googleAnalytics]
    ID = "G-HW62RLV6YR"